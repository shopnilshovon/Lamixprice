<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AHS SMS Pricing</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:
radial-gradient(circle at top left,#1e3a8a 0%,transparent 30%),
radial-gradient(circle at bottom right,#581c87 0%,transparent 30%),
#020817;
min-height:100vh;
color:white;
padding:20px;
overflow-x:hidden;
}

.container{
max-width:950px;
margin:auto;
}

.title-box{
text-align:center;
margin-bottom:35px;
animation:fadeDown 1s ease;
}

.title{
font-size:58px;
font-weight:900;
background:linear-gradient(90deg,#60a5fa,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.subtitle{
color:#94a3b8;
margin-top:10px;
font-size:18px;
}

.search-box{
position:sticky;
top:15px;
z-index:999;
margin-bottom:25px;
backdrop-filter:blur(10px);
animation:fadeDown 1s ease;
}

.search-input{
width:100%;
height:70px;
border:none;
outline:none;
border-radius:24px;
padding:0 24px;
font-size:24px;
background:rgba(15,23,42,.75);
backdrop-filter:blur(20px);
color:#fff;
border:1px solid rgba(255,255,255,.06);
transition:.3s;
}

.search-input:focus{
border-color:#3b82f6;
box-shadow:0 0 25px rgba(59,130,246,.25);
transform:scale(1.01);
}

.search-input::placeholder{
color:#7c859f;
}

.country-list{
display:flex;
flex-direction:column;
gap:22px;
}

.card{
background:rgba(15,23,42,.75);
backdrop-filter:blur(16px);
border:1px solid rgba(255,255,255,.06);
border-radius:30px;
padding:24px;
transition:.35s;
overflow:hidden;
position:relative;
animation:fadeUp .6s ease;
}

.card::before{
content:'';
position:absolute;
inset:0;
background:linear-gradient(135deg,rgba(255,255,255,.06),transparent);
opacity:0;
transition:.3s;
}

.card:hover::before{
opacity:1;
}

.card:hover{
transform:translateY(-5px);
border-color:#3b82f6;
box-shadow:
0 0 30px rgba(59,130,246,.25),
0 0 60px rgba(59,130,246,.08);
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
cursor:pointer;
}

.left{
display:flex;
align-items:center;
gap:18px;
}

.flag{
width:60px;
height:60px;
border-radius:50%;
object-fit:cover;
border:3px solid rgba(255,255,255,.1);
box-shadow:0 0 20px rgba(255,255,255,.1);
}

.country-name{
font-size:30px;
font-weight:800;
}

.country-sub{
font-size:15px;
color:#94a3b8;
margin-top:2px;
}

.price{
font-size:34px;
font-weight:900;
color:#22c55e;
text-shadow:0 0 20px rgba(34,197,94,.3);
}

.expand{
display:none;
margin-top:24px;
padding-top:24px;
border-top:1px solid rgba(255,255,255,.06);
animation:fadeUp .4s ease;
}

.expand.show{
display:block;
}

.info-box{
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.06);
padding:22px;
border-radius:22px;
line-height:1.9;
font-size:18px;
color:#dbeafe;
margin-bottom:20px;
}

.warning{
color:#facc15;
font-weight:700;
font-size:22px;
margin-bottom:10px;
}

.highlight{
color:#22c55e;
font-weight:800;
}

.work-box{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
padding:24px;
border-radius:24px;
margin-bottom:22px;
box-shadow:
0 0 35px rgba(37,99,235,.25);
}

.work-title{
font-size:18px;
opacity:.9;
margin-bottom:8px;
}

.work-price{
font-size:48px;
font-weight:900;
}

.calculator{
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.06);
padding:22px;
border-radius:24px;
}

.calc-title{
font-size:24px;
font-weight:700;
margin-bottom:18px;
}

.calc-input{
width:100%;
height:65px;
border:none;
outline:none;
border-radius:18px;
padding:0 20px;
font-size:24px;
background:#0b132b;
color:white;
margin-bottom:18px;
transition:.3s;
}

.calc-input:focus{
border:1px solid #3b82f6;
box-shadow:0 0 20px rgba(59,130,246,.25);
}

.calc-result{
background:#0b132b;
border-radius:20px;
padding:22px;
font-size:19px;
line-height:2;
}

.result-price{
font-size:42px;
font-weight:900;
color:#22c55e;
margin-top:10px;
}

.no-result{
text-align:center;
padding:50px 20px;
font-size:26px;
color:#94a3b8;
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes fadeDown{
from{
opacity:0;
transform:translateY(-20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@media(max-width:768px){

.title{
font-size:38px;
}

.subtitle{
font-size:15px;
}

.search-input{
height:60px;
font-size:19px;
}

.country-name{
font-size:22px;
}

.price{
font-size:26px;
}

.flag{
width:50px;
height:50px;
}

.work-price{
font-size:36px;
}

.result-price{
font-size:32px;
}

.calc-input{
font-size:20px;
}

}

</style>
</head>
<body>

<div class="container">

<div class="title-box">
<h1 class="title">AHS SMS Pricing</h1>
<p class="subtitle">
Premium SMS Working Price Dashboard
</p>
</div>

<div class="search-box">
<input
type="text"
class="search-input"
id="searchInput"
placeholder="🔍 Search country..."
>
</div>

<div class="country-list" id="countryList"></div>

</div>

<script>

const countries = [

{name:"Afghanistan",price:0.013,flag:"https://flagcdn.com/w320/af.png"},
{name:"Algeria",price:0.018,flag:"https://flagcdn.com/w320/dz.png"},
{name:"Angola",price:0.015,flag:"https://flagcdn.com/w320/ao.png"},
{name:"Germany",price:0.013,flag:"https://flagcdn.com/w320/de.png"},
{name:"Malaysia",price:0.019,flag:"https://flagcdn.com/w320/my.png"},
{name:"Myanmar",price:0.017,flag:"https://flagcdn.com/w320/mm.png"},
{name:"Pakistan",price:0.013,flag:"https://flagcdn.com/w320/pk.png"},
{name:"Sri Lanka",price:0.023,flag:"https://flagcdn.com/w320/lk.png"},
{name:"Tanzania",price:0.025,flag:"https://flagcdn.com/w320/tz.png"},
{name:"Turkey",price:0.012,flag:"https://flagcdn.com/w320/tr.png"},
{name:"Vietnam",price:0.013,flag:"https://flagcdn.com/w320/vn.png"},
{name:"Zimbabwe",price:0.013,flag:"https://flagcdn.com/w320/zw.png"}

];

const countryList = document.getElementById("countryList");
const searchInput = document.getElementById("searchInput");

function render(data){

countryList.innerHTML = "";

if(data.length === 0){

countryList.innerHTML = `
<div class="no-result">
No Country Found
</div>
`;

return;

}

data.forEach((item,index)=>{

const workingPrice = (item.price - (item.price * 0.10)).toFixed(4);

countryList.innerHTML += `

<div class="card">

<div class="top" onclick="toggleBox(${index})">

<div class="left">

<img src="${item.flag}" class="flag">

<div>

<div class="country-name">
${item.name}
</div>

<div class="country-sub">
Premium SMS Route
</div>

</div>

</div>

<div class="price">
$${item.price}
</div>

</div>

<div class="expand" id="expand${index}">

<div class="info-box">

<div class="warning">
⚠️ 10% Service Charge Applied
</div>

Main Price:
<span class="highlight">
$${item.price}
</span>

<br><br>

10% Service Charge কেটে নেওয়ার পর আপনাদের কাজের মূল দাম (Working Price) হবে:

<br><br>

<span class="highlight">
$${workingPrice}
</span>

</div>

<div class="work-box">

<div class="work-title">
💰 Final Working Price
</div>

<div class="work-price">
$${workingPrice}
</div>

</div>

<div class="calculator">

<div class="calc-title">
📱 SMS Calculator
</div>

<input
type="number"
class="calc-input"
placeholder="Example: 100 SMS"
oninput="calculateSMS(this,${workingPrice},'result${index}')"
>

<div class="calc-result" id="result${index}">

📊 SMS Quantity অনুযায়ী total earning এখানে show হবে।

</div>

</div>

</div>

</div>

`;

});

}

function toggleBox(id){

const box = document.getElementById("expand"+id);

if(box.classList.contains("show")){
box.classList.remove("show");
}else{
box.classList.add("show");
}

}

function calculateSMS(input,price,resultId){

const qty = parseInt(input.value);

if(!qty || qty <= 0){

document.getElementById(resultId).innerHTML = `
📊 SMS Quantity অনুযায়ী total earning এখানে show হবে।
`;

return;

}

const total = (qty * price).toFixed(4);

document.getElementById(resultId).innerHTML = `

📨 Total SMS:
<b>${qty}</b>

<br>

💵 Per SMS Working Price:
<span class="highlight">
$${price}
</span>

<br>

✅ Final Working Amount:

<div class="result-price">
$${total}
</div>

`;

}

searchInput.addEventListener("input",()=>{

const value = searchInput.value.toLowerCase();

const filtered = countries.filter(item =>
item.name.toLowerCase().includes(value)
);

render(filtered);

});

render(countries);

</script>

</body>
</html>
