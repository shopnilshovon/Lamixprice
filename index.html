<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AHS SMS Pricing</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#050816;
color:white;
overflow-x:hidden;
min-height:100vh;
}

/* =========================
BACKGROUND
========================= */

.bg{
position:fixed;
inset:0;
z-index:-1;
overflow:hidden;
background:
linear-gradient(
180deg,
#07153f 0%,
#050b25 35%,
#090018 70%,
#140028 100%
);
}

.bg::before{
content:"";
position:absolute;
top:-220px;
left:-120px;
width:700px;
height:700px;
background:
radial-gradient(circle,
rgba(59,130,246,.55) 0%,
rgba(59,130,246,.25) 30%,
transparent 70%);
filter:blur(60px);
}

.bg::after{
content:"";
position:absolute;
bottom:-250px;
right:-180px;
width:700px;
height:700px;
background:
radial-gradient(circle,
rgba(168,85,247,.45) 0%,
rgba(168,85,247,.18) 35%,
transparent 70%);
filter:blur(70px);
}

.blur1{
position:absolute;
top:35%;
left:50%;
transform:translate(-50%,-50%);
width:500px;
height:500px;
background:
radial-gradient(circle,
rgba(0,183,255,.12) 0%,
transparent 70%);
filter:blur(50px);
}

.blur2{
position:absolute;
bottom:10%;
left:20%;
width:350px;
height:350px;
background:
radial-gradient(circle,
rgba(59,130,246,.10) 0%,
transparent 70%);
filter:blur(40px);
}

.blur3{
position:absolute;
top:60%;
right:10%;
width:320px;
height:320px;
background:
radial-gradient(circle,
rgba(168,85,247,.12) 0%,
transparent 70%);
filter:blur(45px);
}

/* =========================
CONTAINER
========================= */

.container{
max-width:900px;
margin:auto;
padding:25px;
}

/* =========================
HEADER
========================= */

.header{
text-align:center;
margin-bottom:40px;
}

.logo{
width:120px;
height:120px;
margin:auto;
border-radius:30px;
display:flex;
align-items:center;
justify-content:center;
font-size:60px;
background:linear-gradient(135deg,#2563eb,#9333ea);
box-shadow:
0 0 50px rgba(147,51,234,.5),
0 0 100px rgba(37,99,235,.3);
margin-bottom:25px;
animation:float 4s ease-in-out infinite;
}

@keyframes float{
50%{
transform:translateY(-10px);
}
}

.title{
font-size:72px;
font-weight:800;
line-height:1;
background:linear-gradient(to right,#7dd3fc,#60a5fa,#e879f9);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:15px;
}

.subtitle{
font-size:24px;
color:#cbd5e1;
}

/* =========================
SEARCH
========================= */

.searchBox{
margin:35px 0;
position:relative;
}

.searchInput{
width:100%;
height:85px;
border:none;
outline:none;
padding:0 30px 0 85px;
border-radius:30px;
font-size:32px;
background:rgba(8,15,40,.85);
backdrop-filter:blur(20px);
color:white;
border:1px solid rgba(255,255,255,.08);
box-shadow:
0 0 25px rgba(0,0,0,.4),
inset 0 0 25px rgba(255,255,255,.02);
}

.searchInput::placeholder{
color:#94a3b8;
}

.searchIcon{
position:absolute;
left:30px;
top:50%;
transform:translateY(-50%);
font-size:36px;
color:#94a3b8;
}

/* =========================
CARD
========================= */

.card{
background:
linear-gradient(
135deg,
rgba(15,23,60,.95),
rgba(8,13,40,.95)
);

border:1px solid rgba(255,255,255,.08);

border-radius:35px;
padding:28px;
margin-bottom:28px;
cursor:pointer;
transition:.35s;
overflow:hidden;
position:relative;
backdrop-filter:blur(18px);

box-shadow:
0 0 30px rgba(0,0,0,.35),
inset 0 0 30px rgba(255,255,255,.02);
}

.card:hover{
transform:translateY(-6px) scale(1.01);
border-color:#3b82f6;
box-shadow:
0 0 40px rgba(59,130,246,.25),
0 0 90px rgba(168,85,247,.15);
}

.top{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.left{
display:flex;
align-items:center;
gap:22px;
min-width:0;
}

.flag{
width:80px;
height:80px;
border-radius:50%;
object-fit:cover;
box-shadow:0 0 25px rgba(255,255,255,.12);
flex-shrink:0;
}

.country{
font-size:42px;
font-weight:800;
line-height:1.1;
word-break:break-word;
}

.route{
font-size:22px;
color:#94a3b8;
margin-top:8px;
}

.price{
font-size:48px;
font-weight:800;
color:#22c55e;
text-shadow:0 0 20px rgba(34,197,94,.5);
flex-shrink:0;
}

/* =========================
DETAILS
========================= */

.details{
display:none;
margin-top:25px;
animation:fade .4s ease;
}

.card.active .details{
display:block;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.notice{
background:rgba(255,255,255,.03);
padding:25px;
border-radius:25px;
border:1px solid rgba(255,255,255,.05);
margin-bottom:20px;
}

.notice h3{
font-size:30px;
margin-bottom:15px;
color:#facc15;
}

.notice p{
font-size:22px;
line-height:1.8;
color:#dbeafe;
}

.workBox{
background:linear-gradient(135deg,#2563eb,#3b82f6);
padding:25px;
border-radius:25px;
margin-bottom:20px;
}

.workBox h4{
font-size:24px;
margin-bottom:10px;
}

.workPrice{
font-size:60px;
font-weight:800;
}

.calc{
background:rgba(255,255,255,.03);
padding:25px;
border-radius:25px;
border:1px solid rgba(255,255,255,.05);
}

.calc h3{
font-size:32px;
margin-bottom:20px;
}

.smsInput{
width:100%;
height:75px;
border:none;
outline:none;
padding:0 25px;
border-radius:20px;
background:#081126;
font-size:28px;
color:white;
margin-bottom:20px;
border:1px solid rgba(59,130,246,.4);
}

.result{
background:#081126;
padding:25px;
border-radius:20px;
font-size:24px;
line-height:2;
}

.final{
font-size:55px;
font-weight:800;
color:#22c55e;
margin-top:10px;
}

/* =========================
FOOTER
========================= */

.footer{
text-align:center;
padding:50px 0 20px;
font-size:24px;
color:#cbd5e1;
}

.footer span{
color:#60a5fa;
font-weight:700;
}

/* =========================
MOBILE
========================= */

@media(max-width:768px){

.container{
padding:18px;
}

.logo{
width:90px;
height:90px;
font-size:45px;
border-radius:25px;
}

.title{
font-size:34px;
line-height:1.15;
}

.subtitle{
font-size:15px;
}

.searchInput{
height:68px;
font-size:18px;
padding-left:65px;
border-radius:22px;
}

.searchIcon{
left:22px;
font-size:26px;
}

.card{
padding:18px;
border-radius:25px;
}

.left{
gap:14px;
}

.flag{
width:52px;
height:52px;
}

.country{
font-size:21px;
}

.route{
font-size:13px;
}

.price{
font-size:24px;
}

.notice h3{
font-size:20px;
}

.notice p{
font-size:15px;
}

.workBox h4{
font-size:18px;
}

.workPrice{
font-size:36px;
}

.calc h3{
font-size:22px;
}

.smsInput{
height:60px;
font-size:18px;
}

.result{
font-size:16px;
}

.final{
font-size:38px;
}

.footer{
font-size:16px;
}

.bg::before{
top:-180px;
left:-220px;
width:600px;
height:600px;
opacity:.9;
}

.bg::after{
right:-240px;
bottom:-200px;
width:600px;
height:600px;
opacity:.9;
}

}

</style>
</head>

<body>

<div class="bg">
<div class="blur1"></div>
<div class="blur2"></div>
<div class="blur3"></div>
</div>

<div class="container">

<div class="header">
<div class="logo">💎</div>
<div class="title">AHS SMS Pricing</div>
<div class="subtitle">Premium SMS Working Price Dashboard</div>
</div>

<div class="searchBox">
<div class="searchIcon">🔍</div>
<input type="text" class="searchInput" placeholder="Search country..." id="search">
</div>

<div id="list"></div>

<div class="footer">
Powered By <span>AHS SHOVON</span>
</div>

</div>

<script>

const countries = [

{name:"Afghanistan",price:0.013,flag:"https://flagcdn.com/w320/af.png"},
{name:"Algeria",price:0.018,flag:"https://flagcdn.com/w320/dz.png"},
{name:"Angola",price:0.015,flag:"https://flagcdn.com/w320/ao.png"},
{name:"Argentina",price:0.013,flag:"https://flagcdn.com/w320/ar.png"},
{name:"Armenia",price:0.013,flag:"https://flagcdn.com/w320/am.png"},
{name:"Azerbaijan",price:0.01,flag:"https://flagcdn.com/w320/az.png"},
{name:"Belarus",price:0.01,flag:"https://flagcdn.com/w320/by.png"},
{name:"Benin",price:0.013,flag:"https://flagcdn.com/w320/bj.png"},
{name:"Bhutan",price:0.01,flag:"https://flagcdn.com/w320/bt.png"},
{name:"Bolivia",price:0.01,flag:"https://flagcdn.com/w320/bo.png"},
{name:"Cambodia",price:0.023,flag:"https://flagcdn.com/w320/kh.png"},
{name:"Cameroon",price:0.013,flag:"https://flagcdn.com/w320/cm.png"},
{name:"Comoros",price:0.023,flag:"https://flagcdn.com/w320/km.png"},
{name:"Egypt",price:0.01,flag:"https://flagcdn.com/w320/eg.png"},
{name:"Ethiopia",price:0.013,flag:"https://flagcdn.com/w320/et.png"},
{name:"Germany",price:0.013,flag:"https://flagcdn.com/w320/de.png"},
{name:"Indonesia",price:0.013,flag:"https://flagcdn.com/w320/id.png"},
{name:"Iraq",price:0.013,flag:"https://flagcdn.com/w320/iq.png"},
{name:"Jordan",price:0.013,flag:"https://flagcdn.com/w320/jo.png"},
{name:"Kazakhstan",price:0.013,flag:"https://flagcdn.com/w320/kz.png"},
{name:"Kenya",price:0.013,flag:"https://flagcdn.com/w320/ke.png"},
{name:"Kuwait",price:0.01,flag:"https://flagcdn.com/w320/kw.png"},
{name:"Libya",price:0.013,flag:"https://flagcdn.com/w320/ly.png"},
{name:"Malaysia",price:0.019,flag:"https://flagcdn.com/w320/my.png"},
{name:"Morocco",price:0.013,flag:"https://flagcdn.com/w320/ma.png"},
{name:"Myanmar",price:0.017,flag:"https://flagcdn.com/w320/mm.png"},
{name:"Nepal",price:0.01,flag:"https://flagcdn.com/w320/np.png"},
{name:"Nigeria",price:0.013,flag:"https://flagcdn.com/w320/ng.png"},
{name:"Oman",price:0.013,flag:"https://flagcdn.com/w320/om.png"},
{name:"Pakistan",price:0.013,flag:"https://flagcdn.com/w320/pk.png"},
{name:"Palestine",price:0.021,flag:"https://flagcdn.com/w320/ps.png"},
{name:"Russia",price:0.013,flag:"https://flagcdn.com/w320/ru.png"},
{name:"Saudi Arabia",price:0.01,flag:"https://flagcdn.com/w320/sa.png"},
{name:"Senegal",price:0.013,flag:"https://flagcdn.com/w320/sn.png"},
{name:"Sri Lanka",price:0.023,flag:"https://flagcdn.com/w320/lk.png"},
{name:"Sudan",price:0.012,flag:"https://flagcdn.com/w320/sd.png"},
{name:"Syria",price:0.013,flag:"https://flagcdn.com/w320/sy.png"},
{name:"Tajikistan",price:0.01,flag:"https://flagcdn.com/w320/tj.png"},
{name:"Tanzania",price:0.025,flag:"https://flagcdn.com/w320/tz.png"},
{name:"Tunisia",price:0.018,flag:"https://flagcdn.com/w320/tn.png"},
{name:"Turkey",price:0.012,flag:"https://flagcdn.com/w320/tr.png"},
{name:"Uganda",price:0.012,flag:"https://flagcdn.com/w320/ug.png"},
{name:"Ukraine",price:0.012,flag:"https://flagcdn.com/w320/ua.png"},
{name:"United Arab Emirates",price:0.01,flag:"https://flagcdn.com/w320/ae.png"},
{name:"Uzbekistan",price:0.013,flag:"https://flagcdn.com/w320/uz.png"},
{name:"Vietnam",price:0.013,flag:"https://flagcdn.com/w320/vn.png"},
{name:"Yemen",price:0.013,flag:"https://flagcdn.com/w320/ye.png"},
{name:"Zambia",price:0.013,flag:"https://flagcdn.com/w320/zm.png"},
{name:"Zimbabwe",price:0.013,flag:"https://flagcdn.com/w320/zw.png"}

];

const list = document.getElementById("list");

function render(data){

list.innerHTML = "";

data.forEach((c,index)=>{

const working = (c.price * 0.90).toFixed(4);

const card = document.createElement("div");
card.className = "card";

card.innerHTML = `
<div class="top">

<div class="left">
<img class="flag" src="${c.flag}">
<div>
<div class="country">${c.name}</div>
<div class="route">Premium SMS Route</div>
</div>
</div>

<div class="price">$${c.price}</div>

</div>

<div class="details">

<div class="notice">
<h3>⚠ 10% Service Charge Applied</h3>

<p>
Main Price:
<b style="color:#22c55e;">$${c.price}</b>

<br><br>

10% Service Charge কেটে নেওয়ার পর আপনাদের কাজের মূল দাম (Working Price) হবে:

<br><br>

<b style="font-size:32px;color:#22c55e;">
$${working}
</b>
</p>
</div>

<div class="workBox">
<h4>💰 Final Working Price</h4>
<div class="workPrice">$${working}</div>
</div>

<div class="calc">

<h3>🧮 SMS Calculator</h3>

<input
type="number"
class="smsInput"
placeholder="Example: 100 SMS"
oninput="calculate(this,${working})"
>

<div class="result">

📨 Total SMS:
<b class="smsCount">0</b>

<br>

💵 Per SMS Working Price:
<b style="color:#22c55e;">
$${working}
</b>

<br>

✅ Final Working Amount:

<div class="final">$0</div>

</div>

</div>

</div>
`;

card.onclick = function(e){

if(
e.target.classList.contains("smsInput")
)return;

document.querySelectorAll(".card").forEach(el=>{
if(el!==card){
el.classList.remove("active");
}
});

card.classList.toggle("active");

};

list.appendChild(card);

});

}

function calculate(input,price){

const qty = Number(input.value || 0);

const result = qty * price;

const box = input.parentElement.querySelector(".result");

box.querySelector(".smsCount").innerText = qty;

box.querySelector(".final").innerText =
"$" + parseFloat(result.toFixed(4));

}

render(countries);

document.getElementById("search").addEventListener("input",e=>{

const value = e.target.value.toLowerCase();

const filtered = countries.filter(c=>
c.name.toLowerCase().includes(value)
);

render(filtered);

});

</script>

</body>
</html>
