<title>AHS SMS Pricing</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050816;
    font-family:sans-serif;
    color:white;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:25px;
    font-size:42px;
    color:#4f8eff;
    font-weight:bold;
}

#search{
    width:100%;
    padding:18px;
    border:none;
    outline:none;
    border-radius:18px;
    background:#0f172a;
    color:white;
    font-size:18px;
    margin-bottom:25px;
}

#search::placeholder{
    color:#7c8595;
}

.country{
    background:#0f172a;
    padding:20px;
    border-radius:20px;
    margin-bottom:15px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    transition:.2s;
}

.country:hover{
    transform:translateY(-2px);
    background:#16213b;
}

.left{
    display:flex;
    align-items:center;
    gap:14px;
}

.flag{
    font-size:30px;
}

.name{
    font-size:22px;
    font-weight:600;
}

.price{
    color:#35d45a;
    font-size:24px;
    font-weight:bold;
}

.notfound{
    text-align:center;
    padding:40px;
    color:#999;
    font-size:20px;
}

</style>
</head>
<body>

<div class="container">

    <h1>AHS SMS Pricing</h1>

const list = document.getElementById('list');

function render(data){

    if(data.length === 0){

        list.innerHTML = `
            <div class="notfound">
                No country found
            </div>
        `;

        return;
    }

    list.innerHTML = data.map(item => `

        <div class="country">

            <div class="left">

                <div class="flag">
                    ${item.flag}
                </div>

                <div class="name">
                    ${item.country}
                </div>

            </div>

            <div class="price">
                $${item.price}
            </div>

        </div>

    `).join('');
}

function searchCountry(){

    const q = document
        .getElementById('search')
        .value
        .toLowerCase();

    const filtered = prices.filter(item =>
        item.country.toLowerCase().includes(q)
    );

    render(filtered);
}

render(prices);

</script>
