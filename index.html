<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AHS SMS Pricing</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#020617;
color:white;
overflow-x:hidden;
min-height:100vh;
position:relative;
}

/* BACKGROUND */

.bg{
position:fixed;
inset:0;
z-index:-1;
overflow:hidden;
}

.blur1{
position:absolute;
width:500px;
height:500px;
background:#2563eb;
border-radius:50%;
filter:blur(140px);
top:-120px;
left:-120px;
opacity:.65;
animation:move1 10s infinite alternate ease-in-out;
}

.blur2{
position:absolute;
width:450px;
height:450px;
background:#9333ea;
border-radius:50%;
filter:blur(140px);
bottom:-100px;
right:-100px;
opacity:.55;
animation:move2 12s infinite alternate ease-in-out;
}

.blur3{
position:absolute;
width:300px;
height:300px;
background:#0ea5e9;
border-radius:50%;
filter:blur(120px);
top:45%;
left:50%;
transform:translate(-50%,-50%);
opacity:.28;
}

@keyframes move1{
0%{
transform:translate(0,0);
}
100%{
transform:translate(60px,60px);
}
}

@keyframes move2{
0%{
transform:translate(0,0);
}
100%{
transform:translate(-70px,-50px);
}
}

/* MAIN */

.container{
max-width:950px;
margin:auto;
padding:24px;
}

.header{
text-align:center;
padding-top:20px;
margin-bottom:35px;
animation:fadeDown 1s ease;
}

.logo{
width:110px;
height:110px;
margin:auto;
border-radius:32px;
background:linear-gradient(135deg,#2563eb,#9333ea);
display:flex;
align-items:center;
justify-content:center;
font-size:55px;
box-shadow:
0 0 40px rgba(59,130,246,.45),
0 0 90px rgba(147,51,234,.35);
margin-bottom:20px;
animation:float 3s ease-in-out infinite;
}

.title{
font-size:62px;
font-weight:900;
line-height:1.05;
background:linear-gradient(90deg,#60a5fa,#c084fc);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.subtitle{
font-size:20px;
color:#cbd5e1;
margin-top:14px;
}

/* SEARCH */

.search-box{
margin-bottom:26px;
position:sticky;
top:12px;
z-index:999;
backdrop-filter:blur(14px);
}

.search-input{
width:100%;
height:76px;
border:none;
outline:none;
padding:0 26px;
border-radius:28px;
background:rgba(15,23,42,.7);
backdrop-filter:blur(14px);
color:white;
font-size:26px;
border:1px solid rgba(255,255,255,.06);
transition:.35s;
}

.search-input:focus{
border-color:#3b82f6;
transform:scale(1.01);
box-shadow:
0 0 25px rgba(59,130,246,.25),
0 0 60px rgba(147,51,234,.2);
background:rgba(15,23,42,.92);
}

.search-input::placeholder{
color:#94a3b8;
}

/* COUNTRY */

.country-list{
display:flex;
flex-direction:column;
gap:24px;
}

.card{
background:rgba(15,23,42,.68);
backdrop-filter:blur(14px);
border-radius:34px;
padding:24px;
border:1px solid rgba(255,255,255,.05);
transition:.35s;
overflow:hidden;
animation:fadeUp .6s ease;
}

.card:hover{
transform:translateY(-5px);
box-shadow:
0 0 35px rgba(59,130,246,.25),
0 0 80px rgba(147,51,234,.18);
border-color:#3b82f6;
}

.top{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
cursor:pointer;
}

.left{
display:flex;
align-items:center;
gap:18px;
}

.flag{
width:70px;
height:70px;
border-radius:50%;
object-fit:cover;
border:3px solid rgba(255,255,255,.08);
box-shadow:0 0 25px rgba(255,255,255,.12);
}

.country-name{
font-size:34px;
font-weight:800;
}

.country-sub{
font-size:17px;
color:#94a3b8;
margin-top:5px;
}

.price{
font-size:40px;
font-weight:900;
color:#22c55e;
text-shadow:0 0 18px rgba(34,197,94,.35);
}

/* EXPAND */

.expand{
max-height:0;
overflow:hidden;
transition:max-height .5s ease;
}

.expand.show{
max-height:1000px;
margin-top:24px;
}

.notice{
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.06);
padding:24px;
border-radius:24px;
font-size:20px;
line-height:1.9;
color:#dbeafe;
margin-bottom:22px;
}

.notice-title{
font-size:26px;
font-weight:800;
color:#facc15;
margin-bottom:10px;
}

.green{
color:#22c55e;
font-weight:800;
}

.work-box{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
padding:24px;
border-radius:26px;
margin-bottom:22px;
box-shadow:0 0 40px rgba(37,99,235,.25);
}

.work-title{
font-size:21px;
margin-bottom:10px;
}

.work-price{
font-size:52px;
font-weight:900;
}

.calculator{
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.06);
padding:24px;
border-radius:26px;
}

.calc-title{
font-size:30px;
font-weight:800;
margin-bottom:18px;
}

.calc-input{
width:100%;
height:70px;
border:none;
outline:none;
border-radius:20px;
padding:0 22px;
font-size:25px;
background:#0b132b;
color:white;
margin-bottom:18px;
border:1px solid transparent;
transition:.3s;
}

.calc-input:focus{
border-color:#3b82f6;
box-shadow:0 0 25px rgba(59,130,246,.25);
}

.calc-result{
background:#0b132b;
padding:22px;
border-radius:22px;
font-size:20px;
line-height:2;
}

.result-total{
font-size:46px;
font-weight:900;
color:#22c55e;
margin-top:10px;
}

/* FOOTER */

.footer{
margin-top:45px;
text-align:center;
font-size:17px;
color:#cbd5e1;
padding-bottom:25px;
}

.footer span{
font-weight:800;
color:#60a5fa;
}

/* EMPTY */

.no-result{
text-align:center;
padding:70px 20px;
font-size:30px;
color:#94a3b8;
}

/* ANIMATION */

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(25px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes fadeDown{
from{
opacity:0;
transform:translateY(-25px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes float{
0%{
transform:translateY(0);
}
50%{
transform:translateY(-8px);
}
100%{
transform:translateY(0);
}
}

/* MOBILE */

@media(max-width:768px){

.container{
padding:18px;
}

.logo{
width:95px;
height:95px;
font-size:45px;
}

.title{
font-size:50px;
}

.subtitle{
font-size:17px;
}

.search-input{
height:66px;
font-size:22px;
}

.country-name{
font-size:26px;
}

.country-sub{
font-size:15px;
}

.price{
font-size:30px;
}

.flag{
width:58px;
height:58px;
}

.notice{
font-size:17px;
}

.notice-title{
font-size:23px;
}

.work-price{
font-size:40px;
}

.calc-title{
font-size:24px;
}

.calc-input{
font-size:21px;
height:64px;
}

.result-total{
font-size:34px;
}

}

</style>
</head>
<body>

<div class="bg">
<div class="blur1"></div>
<div class="blur2"></div>
<div class="blur3"></div>
</div>

<div class="container">

<div class="header">

<div class="logo">
💎
</div>

<h1 class="title">
AHS SMS Pricing
</h1>

<p class="subtitle">
Premium SMS Working Price Dashboard
</p>

</div>

<div class="search-box">

<input
type="text"
class="search-input"
id="searchInput"
placeholder="🔍 Search country..."
>

</div>

<div class="country-list" id="countryList"></div>

<div class="footer">
Powered By <span>AHS SHOVON</span>
</div>

</div>

<script>

const countries = [

{name:"Afghanistan",price:0.013,flag:"https://flagcdn.com/w320/af.png"},
{name:"Algeria",price:0.018,flag:"https://flagcdn.com/w320/dz.png"},
{name:"Angola",price:0.015,flag:"https://flagcdn.com/w320/ao.png"},
{name:"Argentina",price:0.013,flag:"https://flagcdn.com/w320/ar.png"},
{name:"Armenia",price:0.013,flag:"https://flagcdn.com/w320/am.png"},
{name:"Azerbaijan",price:0.010,flag:"https://flagcdn.com/w320/az.png"},
{name:"Belarus",price:0.010,flag:"https://flagcdn.com/w320/by.png"},
{name:"Benin",price:0.013,flag:"https://flagcdn.com/w320/bj.png"},
{name:"Bhutan",price:0.010,flag:"https://flagcdn.com/w320/bt.png"},
{name:"Bolivia",price:0.010,flag:"https://flagcdn.com/w320/bo.png"},
{name:"Bulgaria",price:0.010,flag:"https://flagcdn.com/w320/bg.png"},
{name:"Cambodia",price:0.023,flag:"https://flagcdn.com/w320/kh.png"},
{name:"Cameroon",price:0.013,flag:"https://flagcdn.com/w320/cm.png"},
{name:"Comoros",price:0.023,flag:"https://flagcdn.com/w320/km.png"},
{name:"Ecuador",price:0.010,flag:"https://flagcdn.com/w320/ec.png"},
{name:"Egypt",price:0.010,flag:"https://flagcdn.com/w320/eg.png"},
{name:"Ethiopia",price:0.013,flag:"https://flagcdn.com/w320/et.png"},
{name:"Germany",price:0.013,flag:"https://flagcdn.com/w320/de.png"},
{name:"Indonesia",price:0.013,flag:"https://flagcdn.com/w320/id.png"},
{name:"Iraq",price:0.013,flag:"https://flagcdn.com/w320/iq.png"},
{name:"Jordan",price:0.013,flag:"https://flagcdn.com/w320/jo.png"},
{name:"Kazakhstan",price:0.013,flag:"https://flagcdn.com/w320/kz.png"},
{name:"Kenya",price:0.013,flag:"https://flagcdn.com/w320/ke.png"},
{name:"Kuwait",price:0.010,flag:"https://flagcdn.com/w320/kw.png"},
{name:"Libya",price:0.013,flag:"https://flagcdn.com/w320/ly.png"},
{name:"Madagascar",price:0.013,flag:"https://flagcdn.com/w320/mg.png"},
{name:"Malaysia",price:0.019,flag:"https://flagcdn.com/w320/my.png"},
{name:"Morocco",price:0.013,flag:"https://flagcdn.com/w320/ma.png"},
{name:"Myanmar",price:0.017,flag:"https://flagcdn.com/w320/mm.png"},
{name:"Nepal",price:0.010,flag:"https://flagcdn.com/w320/np.png"},
{name:"Nigeria",price:0.013,flag:"https://flagcdn.com/w320/ng.png"},
{name:"Oman",price:0.013,flag:"https://flagcdn.com/w320/om.png"},
{name:"Pakistan",price:0.013,flag:"https://flagcdn.com/w320/pk.png"},
{name:"Russia",price:0.013,flag:"https://flagcdn.com/w320/ru.png"},
{name:"Saudi Arabia",price:0.010,flag:"https://flagcdn.com/w320/sa.png"},
{name:"Senegal",price:0.013,flag:"https://flagcdn.com/w320/sn.png"},
{name:"Sri Lanka",price:0.023,flag:"https://flagcdn.com/w320/lk.png"},
{name:"Sudan",price:0.012,flag:"https://flagcdn.com/w320/sd.png"},
{name:"Syria",price:0.013,flag:"https://flagcdn.com/w320/sy.png"},
{name:"Tajikistan",price:0.010,flag:"https://flagcdn.com/w320/tj.png"},
{name:"Tanzania",price:0.025,flag:"https://flagcdn.com/w320/tz.png"},
{name:"Tunisia",price:0.018,flag:"https://flagcdn.com/w320/tn.png"},
{name:"Turkey",price:0.012,flag:"https://flagcdn.com/w320/tr.png"},
{name:"Turkmenistan",price:0.013,flag:"https://flagcdn.com/w320/tm.png"},
{name:"Uganda",price:0.012,flag:"https://flagcdn.com/w320/ug.png"},
{name:"Ukraine",price:0.012,flag:"https://flagcdn.com/w320/ua.png"},
{name:"United Arab Emirates",price:0.010,flag:"https://flagcdn.com/w320/ae.png"},
{name:"Uzbekistan",price:0.013,flag:"https://flagcdn.com/w320/uz.png"},
{name:"Vietnam",price:0.013,flag:"https://flagcdn.com/w320/vn.png"},
{name:"Yemen",price:0.013,flag:"https://flagcdn.com/w320/ye.png"},
{name:"Zambia",price:0.013,flag:"https://flagcdn.com/w320/zm.png"},
{name:"Zimbabwe",price:0.013,flag:"https://flagcdn.com/w320/zw.png"}

];

const countryList = document.getElementById("countryList");
const searchInput = document.getElementById("searchInput");

function render(data){

countryList.innerHTML = "";

if(data.length===0){

countryList.innerHTML = `
<div class="no-result">
❌ No Country Found
</div>
`;

return;

}

data.forEach((item,index)=>{

const workingPrice = (item.price - (item.price*0.10)).toFixed(4);

countryList.innerHTML += `

<div class="card">

<div class="top" onclick="toggleBox(${index})">

<div class="left">

<img src="${item.flag}" class="flag">

<div>

<div class="country-name">
${item.name}
</div>

<div class="country-sub">
Premium SMS Route
</div>

</div>

</div>

<div class="price">
$${item.price}
</div>

</div>

<div class="expand" id="expand${index}">

<div class="notice">

<div class="notice-title">
⚠️ 10% Service Charge Applied
</div>

Main Price:
<span class="green">
$${item.price}
</span>

<br><br>

10% Service Charge কেটে নেওয়ার পর আপনাদের কাজের মূল দাম (Working Price) হবে:

<br><br>

<span class="green">
$${workingPrice}
</span>

</div>

<div class="work-box">

<div class="work-title">
💰 Final Working Price
</div>

<div class="work-price">
$${workingPrice}
</div>

</div>

<div class="calculator">

<div class="calc-title">
📱 SMS Calculator
</div>

<input
type="number"
class="calc-input"
placeholder="Example: 100 SMS"
oninput="calculateSMS(this,${workingPrice},'result${index}')"
>

<div class="calc-result" id="result${index}">

📊 SMS Quantity অনুযায়ী total earning এখানে show হবে।

</div>

</div>

</div>

</div>

`;

});

}

function toggleBox(id){

const all = document.querySelectorAll(".expand");

all.forEach((box,index)=>{

if(index===id){
box.classList.toggle("show");
}else{
box.classList.remove("show");
}

});

}

function calculateSMS(input,price,resultId){

const qty = parseInt(input.value);

if(!qty || qty<=0){

document.getElementById(resultId).innerHTML = `
📊 SMS Quantity অনুযায়ী total earning এখানে show হবে।
`;

return;

}

const total = (qty * price).toFixed(4);

document.getElementById(resultId).innerHTML = `

📨 Total SMS:
<b>${qty}</b>

<br>

💵 Per SMS Working Price:
<span class="green">
$${price}
</span>

<br>

✅ Final Working Amount:

<div class="result-total">
$${total}
</div>

`;

}

searchInput.addEventListener("input",()=>{

const value = searchInput.value.toLowerCase();

const filtered = countries.filter(item =>
item.name.toLowerCase().includes(value)
);

render(filtered);

});

render(countries);

</script>

</body>
</html>
