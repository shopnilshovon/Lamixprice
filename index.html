<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AHS SMS Pricing</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#020817;
font-family:'Poppins',sans-serif;
color:#fff;
padding:20px;
}

.title{
text-align:center;
font-size:48px;
font-weight:800;
margin-bottom:30px;
background:linear-gradient(90deg,#4f7cff,#7c5cff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.search-box{
margin-bottom:25px;
}

.search-box input{
width:100%;
height:65px;
border:none;
outline:none;
border-radius:22px;
background:#0b132b;
padding:0 24px;
font-size:24px;
color:#fff;
}

.search-box input::placeholder{
color:#7c859f;
}

.country-list{
display:flex;
flex-direction:column;
gap:18px;
}

.card{
background:#111c3d;
border-radius:24px;
padding:22px;
transition:.25s;
border:2px solid transparent;
cursor:pointer;
}

.card:hover{
border-color:#3b82f6;
transform:translateY(-2px);
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.left{
display:flex;
align-items:center;
gap:16px;
}

.flag{
width:55px;
height:55px;
border-radius:50%;
object-fit:cover;
border:2px solid rgba(255,255,255,.1);
}

.country{
font-size:26px;
font-weight:700;
}

.price{
font-size:28px;
font-weight:700;
color:#22c55e;
}

.extra{
display:none;
margin-top:20px;
padding-top:20px;
border-top:1px solid rgba(255,255,255,.08);
animation:fade .3s ease;
}

.extra.show{
display:block;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.info-box{
background:#0b132b;
padding:18px;
border-radius:18px;
line-height:1.8;
font-size:17px;
color:#dbeafe;
margin-bottom:18px;
}

.highlight{
color:#22c55e;
font-weight:700;
}

.warning{
color:#facc15;
font-weight:600;
font-size:22px;
}

.work-price-box{
background:linear-gradient(135deg,#1d4ed8,#2563eb);
padding:18px;
border-radius:18px;
margin-bottom:20px;
}

.work-title{
font-size:16px;
opacity:.9;
margin-bottom:8px;
}

.work-price{
font-size:34px;
font-weight:800;
}

.calculator{
background:#0b132b;
padding:18px;
border-radius:18px;
}

.calculator h3{
font-size:20px;
margin-bottom:15px;
}

.calc-input{
width:100%;
height:58px;
border:none;
outline:none;
border-radius:14px;
padding:0 18px;
font-size:22px;
background:#111c3d;
color:#fff;
margin-bottom:15px;
}

.calc-result{
background:#111c3d;
padding:16px;
border-radius:14px;
font-size:18px;
line-height:1.8;
}

.result-price{
color:#22c55e;
font-size:28px;
font-weight:800;
}

.no-result{
text-align:center;
padding:50px 20px;
font-size:24px;
color:#94a3b8;
}

@media(max-width:768px){

.title{
font-size:34px;
}

.country{
font-size:21px;
}

.price{
font-size:24px;
}

.flag{
width:48px;
height:48px;
}

.search-box input{
font-size:20px;
height:58px;
}

.work-price{
font-size:28px;
}

}

</style>
</head>
<body>

{name:"Zimbabwe",price:0.013,flag:"https://flagcdn.com/w320/zw.png"}

];

const list = document.getElementById("countryList");
const searchInput = document.getElementById("searchInput");

function render(data){

list.innerHTML = "";

if(data.length === 0){
list.innerHTML = `<div class="no-result">No Country Found</div>`;
return;
}

data.forEach((item,index)=>{

const workingPrice = (item.price - (item.price * 0.10)).toFixed(4);

list.innerHTML += `

<div class="card">

<div class="top" onclick="toggleBox(${index})">

<div class="left">
<img src="${item.flag}" class="flag">
<div class="country">${item.name}</div>
</div>

<div class="price">
$${item.price}
</div>

</div>

<div class="extra" id="box${index}">

<div class="info-box">

<div class="warning">
⚠️ 10% Service Charge Applied
</div>

<br>

Main Price:
<span class="highlight">$${item.price}</span>

<br>

10% Service Charge কেটে নেওয়ার পর আপনাদের কাজের মূল দাম (Working Price) হবে:

<span class="highlight">$${workingPrice}</span>

</div>

<div class="work-price-box">

<div class="work-title">
💰 Final Working Price
</div>

<div class="work-price">
$${workingPrice}
</div>

</div>

<div class="calculator">

<h3>📱 SMS Calculator</h3>

<input 
type="number" 
class="calc-input" 
placeholder="Example: 100 SMS"
oninput="calculateSMS(this, ${workingPrice}, 'result${index}')"
>

<div class="calc-result" id="result${index}">

📊 SMS Quantity অনুযায়ী total earning এখানে show হবে।

</div>

</div>

</div>

</div>

`;

});

}

function toggleBox(id){

const box = document.getElementById("box"+id);

if(box.classList.contains("show")){
box.classList.remove("show");
}else{
box.classList.add("show");
}

}

function calculateSMS(input, price, resultId){

const qty = parseInt(input.value);

if(!qty || qty <= 0){
document.getElementById(resultId).innerHTML = `
📊 SMS Quantity অনুযায়ী total earning এখানে show হবে।
`;
return;
}

const total = (qty * price).toFixed(4);

document.getElementById(resultId).innerHTML = `

📨 Total SMS: <b>${qty}</b>

<br><br>

💵 Per SMS Working Price: <span class="highlight">$${price}</span>

<br><br>

✅ Total Working Amount:

<div class="result-price">
$${total}
</div>

`;

}

searchInput.addEventListener("input", ()=>{

const value = searchInput.value.toLowerCase();

const filtered = countries.filter(item =>
item.name.toLowerCase().includes(value)
);

render(filtered);

});

render(countries);

</script>

</body>
</html>
