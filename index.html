<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AHS SMS Pricing</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#020617;
color:white;
overflow-x:hidden;
min-height:100vh;
}

/* BACKGROUND */

.bg{
position:fixed;
inset:0;
z-index:-1;
background:
linear-gradient(
180deg,
#020617 0%,
#050b1f 35%,
#0b1025 70%,
#14061f 100%
);
overflow:hidden;
}

.bg::before{
content:"";
position:absolute;
top:-200px;
left:-200px;
width:700px;
height:700px;
background:radial-gradient(circle,
rgba(37,99,235,.35),
transparent 70%);
filter:blur(80px);
}

.bg::after{
content:"";
position:absolute;
bottom:-250px;
right:-200px;
width:700px;
height:700px;
background:radial-gradient(circle,
rgba(168,85,247,.30),
transparent 70%);
filter:blur(80px);
}

.blur{
position:absolute;
top:40%;
left:50%;
transform:translate(-50%,-50%);
width:500px;
height:500px;
background:radial-gradient(circle,
rgba(0,183,255,.10),
transparent 70%);
filter:blur(70px);
}

/* CONTAINER */

.container{
max-width:850px;
margin:auto;
padding:20px;
}

/* HEADER */

.header{
text-align:center;
padding:30px 10px;
}

.logo{
width:95px;
height:95px;
margin:auto;
border-radius:28px;
background:linear-gradient(135deg,#2563eb,#9333ea);
display:flex;
align-items:center;
justify-content:center;
font-size:48px;
box-shadow:
0 0 40px rgba(59,130,246,.4),
0 0 80px rgba(168,85,247,.3);
animation:float 4s ease-in-out infinite;
margin-bottom:22px;
}

@keyframes float{
50%{
transform:translateY(-10px);
}
}

.title{
font-size:58px;
font-weight:800;
line-height:1.1;
background:linear-gradient(to right,#60a5fa,#93c5fd,#e879f9);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:12px;
text-shadow:0 0 30px rgba(96,165,250,.15);
}

.subtitle{
font-size:22px;
color:#cbd5e1;
}

/* SEARCH */

.searchBox{
margin:35px 0;
position:relative;
}

.searchInput{
width:100%;
height:75px;
border:none;
outline:none;
padding:0 25px 0 70px;
border-radius:24px;
font-size:22px;
background:rgba(8,15,35,.88);
color:white;
border:1px solid rgba(255,255,255,.06);
backdrop-filter:blur(20px);
transition:.3s;
}

.searchInput:focus{
border-color:#3b82f6;
box-shadow:
0 0 25px rgba(59,130,246,.25);
}

.searchInput::placeholder{
color:#94a3b8;
}

.searchIcon{
position:absolute;
left:24px;
top:50%;
transform:translateY(-50%);
font-size:26px;
color:#94a3b8;
}

/* CARD */

.card{
background:
linear-gradient(
135deg,
rgba(12,20,45,.95),
rgba(6,10,28,.96)
);

border:1px solid rgba(255,255,255,.05);

border-radius:26px;
padding:18px;
margin-bottom:16px;

transition:.3s;
cursor:pointer;

backdrop-filter:blur(20px);

box-shadow:
0 0 30px rgba(0,0,0,.35);
}

.card:hover{
transform:translateY(-3px);
border-color:#2563eb;
box-shadow:
0 0 25px rgba(37,99,235,.25);
}

.top{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.left{
display:flex;
align-items:center;
gap:15px;
min-width:0;
}

.flag{
width:58px;
height:58px;
border-radius:50%;
object-fit:cover;
flex-shrink:0;
box-shadow:0 0 20px rgba(255,255,255,.10);
}

.country{
font-size:26px;
font-weight:700;
line-height:1.1;
word-break:break-word;
}

.route{
font-size:14px;
color:#94a3b8;
margin-top:4px;
}

.price{
font-size:34px;
font-weight:800;
color:#22c55e;
text-shadow:0 0 15px rgba(34,197,94,.4);
flex-shrink:0;
}

/* DETAILS */

.details{
display:none;
margin-top:18px;
animation:fade .35s ease;
}

.card.active .details{
display:block;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.calc{
background:rgba(255,255,255,.03);
border-radius:22px;
padding:20px;
border:1px solid rgba(255,255,255,.04);
}

.calc h3{
font-size:24px;
margin-bottom:15px;
}

.smsInput{
width:100%;
height:60px;
border:none;
outline:none;
border-radius:18px;
padding:0 18px;
font-size:20px;
background:#081126;
color:white;
border:1px solid rgba(59,130,246,.3);
margin-bottom:18px;
}

.result{
background:#081126;
border-radius:18px;
padding:18px;
font-size:17px;
line-height:2;
}

.final{
font-size:38px;
font-weight:800;
color:#22c55e;
margin-top:10px;
}

/* NOT FOUND */

.notfound{
text-align:center;
padding:40px 20px;
background:rgba(255,255,255,.03);
border-radius:25px;
border:1px solid rgba(255,255,255,.04);
}

.notfound h2{
font-size:28px;
margin-bottom:10px;
color:#f87171;
}

.notfound p{
font-size:16px;
color:#cbd5e1;
}

/* FOOTER */

.footer{
text-align:center;
padding:45px 0 25px;
font-size:18px;
color:#cbd5e1;
}

.footer span{
color:#60a5fa;
font-weight:700;
}

/* MOBILE */

@media(max-width:768px){

.container{
padding:15px;
}

.logo{
width:85px;
height:85px;
font-size:42px;
}

.title{
font-size:34px;
}

.subtitle{
font-size:15px;
}

.searchInput{
height:65px;
font-size:18px;
padding-left:60px;
}

.searchIcon{
font-size:22px;
left:20px;
}

.card{
padding:14px;
border-radius:20px;
margin-bottom:12px;
}

.flag{
width:48px;
height:48px;
}

.country{
font-size:16px;
}

.route{
font-size:11px;
}

.price{
font-size:18px;
}

.calc h3{
font-size:18px;
}

.smsInput{
height:52px;
font-size:17px;
}

.result{
font-size:14px;
}

.final{
font-size:28px;
}

.footer{
font-size:15px;
}

}

</style>
</head>

<body>

<div class="bg">
<div class="blur"></div>
</div>

<div class="container">

<div class="header">
<div class="logo">💎</div>
<div class="title">AHS SMS Pricing</div>
<div class="subtitle">Premium SMS Earnings Dashboard</div>
</div>

<div class="searchBox">
<div class="searchIcon">🔍</div>

<input
type="text"
class="searchInput"
placeholder="Search country..."
id="search"

</div>

<div id="list"></div>

<div class="footer">
Powered By <span>AHS SHOVON</span>

</div>

{name:"Zimbabwe",price:0.0112,flag:"https://flagcdn.com/w320/zw.png"}

];

const list = document.getElementById("list");

function render(data){

list.innerHTML = "";

if(data.length === 0){

list.innerHTML = `
<div class="notfound">
<h2>❌ Country Not Available</h2>
<p>
Sorry, this country is currently unavailable in our SMS route list.
</p>
</div>
`;

return;
}

data.forEach(c=>{

const card = document.createElement("div");

card.className = "card";

card.innerHTML = `

<div class="top">

<div class="left">

<img class="flag" src="${c.flag}">

<div>
<div class="country">${c.name}</div>
<div class="route">Premium SMS Route</div>
</div>

</div>

<div class="price">$${c.price}</div>

</div>

<div class="details">

<div class="calc">

<h3>🧮 SMS Earnings Calculator</h3>

<input
type="number"
class="smsInput"
placeholder="Example: 100 SMS"
oninput="calculate(this,${c.price})"
>

<div class="result">

📨 Total SMS:
<b class="smsCount">0</b>

<br>

💵 Per SMS Earnings:
<b style="color:#22c55e;">
$${c.price}
</b>

<br>

✅ Total Earnings:

<div class="final">$0</div>

</div>

</div>

</div>

`;

card.onclick = function(e){

if(e.target.classList.contains("smsInput"))
return;

document.querySelectorAll(".card").forEach(el=>{
if(el!==card){
el.classList.remove("active");
}
});

card.classList.toggle("active");

};

list.appendChild(card);

});

}

function calculate(input,price){

const qty = Number(input.value || 0);

const result = qty * price;

const box = input.parentElement.querySelector(".result");

box.querySelector(".smsCount").innerText = qty;

box.querySelector(".final").innerText =
"$" + Number(result.toFixed(4));

}

render(countries);

document.getElementById("search").addEventListener("input",e=>{

const value = e.target.value.toLowerCase();

const filtered = countries.filter(c=>
c.name.toLowerCase().includes(value)
);

render(filtered);

});

</script>

</html>
