<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AHS SMS Pricing</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#050816;
color:white;
overflow-x:hidden;
min-height:100vh;
}

/* =========================
BACKGROUND
========================= */

.bg{
position:fixed;
inset:0;
z-index:-1;
overflow:hidden;

background:
linear-gradient(
180deg,
#081338 0%,
#040b25 30%,
#070019 65%,
#130028 100%
);
}

.bg::before{
content:"";
position:absolute;
top:-250px;
left:-180px;
width:700px;
height:700px;

background:
radial-gradient(circle,
rgba(37,99,235,.55) 0%,
rgba(37,99,235,.2) 40%,
transparent 70%);

filter:blur(80px);
}

.bg::after{
content:"";
position:absolute;
right:-220px;
bottom:-250px;
width:700px;
height:700px;

background:
radial-gradient(circle,
rgba(168,85,247,.45) 0%,
rgba(168,85,247,.18) 40%,
transparent 70%);

filter:blur(90px);
}

.blur1{
position:absolute;
top:40%;
left:50%;
transform:translate(-50%,-50%);
width:500px;
height:500px;

background:
radial-gradient(circle,
rgba(0,183,255,.10),
transparent 70%);

filter:blur(60px);
}

.blur2{
position:absolute;
bottom:10%;
left:10%;
width:350px;
height:350px;

background:
radial-gradient(circle,
rgba(59,130,246,.10),
transparent 70%);

filter:blur(50px);
}

.blur3{
position:absolute;
top:65%;
right:10%;
width:350px;
height:350px;

background:
radial-gradient(circle,
rgba(168,85,247,.12),
transparent 70%);

filter:blur(55px);
}

/* =========================
CONTAINER
========================= */

.container{
max-width:850px;
margin:auto;
padding:20px;
}

/* =========================
HEADER
========================= */

.header{
text-align:center;
padding-top:30px;
margin-bottom:30px;
}

.logo{
width:100px;
height:100px;
margin:auto;
border-radius:28px;

display:flex;
align-items:center;
justify-content:center;

font-size:48px;

background:
linear-gradient(135deg,#2563eb,#9333ea);

box-shadow:
0 0 40px rgba(59,130,246,.35),
0 0 80px rgba(147,51,234,.25);

margin-bottom:22px;

animation:float 4s ease-in-out infinite;
}

@keyframes float{
50%{
transform:translateY(-10px);
}
}

.title{
font-size:68px;
font-weight:800;
line-height:1;

background:
linear-gradient(
to right,
#7dd3fc,
#60a5fa,
#e879f9
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

margin-bottom:15px;
}

.subtitle{
font-size:24px;
color:#cbd5e1;
}

/* =========================
SEARCH
========================= */

.searchBox{
margin:25px 0 20px;
position:sticky;
top:10px;
z-index:100;
}

.searchWrap{
position:relative;
}

.searchInput{
width:100%;
height:65px;
border:none;
outline:none;

padding:0 20px 0 60px;

border-radius:22px;

font-size:18px;
font-weight:600;

background:rgba(7,14,35,.88);

backdrop-filter:blur(18px);

color:white;

border:1px solid rgba(59,130,246,.25);

box-shadow:
0 0 20px rgba(0,0,0,.25),
inset 0 0 20px rgba(255,255,255,.02);

transition:.35s;
}

.searchInput:focus{

border-color:#60a5fa;

box-shadow:
0 0 30px rgba(59,130,246,.25),
0 0 70px rgba(168,85,247,.12);

transform:scale(1.01);
}

.searchInput::placeholder{
color:#8da2c7;
}

.searchIcon{
position:absolute;
left:20px;
top:50%;
transform:translateY(-50%);
font-size:22px;
color:#94a3b8;
}

/* =========================
CARD
========================= */

.card{

background:
linear-gradient(
135deg,
rgba(15,23,60,.95),
rgba(8,13,40,.95)
);

border:1px solid rgba(255,255,255,.05);

border-radius:22px;

padding:15px;

margin-bottom:13px;

cursor:pointer;

transition:.35s;

overflow:hidden;

position:relative;

backdrop-filter:blur(18px);

box-shadow:
0 0 25px rgba(0,0,0,.25),
inset 0 0 25px rgba(255,255,255,.02);
}

.card:hover{

transform:translateY(-4px);

border-color:#3b82f6;

box-shadow:
0 0 35px rgba(59,130,246,.18),
0 0 70px rgba(168,85,247,.08);
}

.top{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
}

.left{
display:flex;
align-items:center;
gap:14px;
min-width:0;
}

.flag{
width:50px;
height:50px;
border-radius:50%;
object-fit:cover;

box-shadow:
0 0 20px rgba(255,255,255,.12);

flex-shrink:0;
}

.country{
font-size:20px;
font-weight:700;
line-height:1.1;

word-break:break-word;
}

.route{
font-size:12px;
color:#94a3b8;
margin-top:5px;
}

.price{
font-size:24px;
font-weight:800;

color:#22c55e;

text-shadow:
0 0 20px rgba(34,197,94,.4);

flex-shrink:0;
}

/* =========================
DETAILS
========================= */

.details{
display:none;
margin-top:18px;
animation:fade .35s ease;
}

.card.active .details{
display:block;
}

@keyframes fade{

from{
opacity:0;
transform:translateY(10px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.workBox{

background:
linear-gradient(
135deg,
#2563eb,
#3b82f6
);

padding:20px;

border-radius:20px;

margin-bottom:18px;
}

.workBox h4{
font-size:18px;
margin-bottom:10px;
}

.workPrice{
font-size:38px;
font-weight:800;
}

/* =========================
CALCULATOR
========================= */

.calc{

background:
rgba(255,255,255,.03);

padding:18px;

border-radius:20px;

border:1px solid rgba(255,255,255,.04);
}

.calc h3{
font-size:22px;
margin-bottom:16px;
}

.smsInput{
width:100%;
height:58px;

border:none;
outline:none;

padding:0 18px;

border-radius:18px;

background:#081126;

font-size:18px;
color:white;

margin-bottom:16px;

border:1px solid rgba(59,130,246,.3);
}

.result{

background:#081126;

padding:18px;

border-radius:18px;

font-size:15px;

line-height:2;
}

.final{
font-size:36px;
font-weight:800;
color:#22c55e;
margin-top:8px;
}

/* =========================
NO RESULT
========================= */

.noResult{

padding:40px 20px;

border-radius:22px;

background:
linear-gradient(
135deg,
rgba(15,23,60,.95),
rgba(8,13,40,.95)
);

border:1px solid rgba(255,255,255,.05);

text-align:center;

animation:fade .4s ease;
}

.noResult h2{
font-size:22px;
margin-bottom:10px;
color:#f87171;
}

.noResult p{
font-size:14px;
color:#cbd5e1;
line-height:1.7;
}

/* =========================
FOOTER
========================= */

.footer{
text-align:center;
padding:40px 0 20px;
font-size:18px;
color:#cbd5e1;
}

.footer span{
color:#60a5fa;
font-weight:700;
}

/* =========================
MOBILE
========================= */

@media(max-width:768px){

.container{
padding:14px;
}

.logo{
width:82px;
height:82px;
font-size:40px;
border-radius:24px;
}

.title{
font-size:32px;
line-height:1.15;
}

.subtitle{
font-size:14px;
}

.searchInput{
height:58px;
font-size:16px;
padding-left:52px;
border-radius:18px;
}

.searchIcon{
left:18px;
font-size:18px;
}

.card{
padding:13px;
margin-bottom:12px;
border-radius:18px;
}

.flag{
width:46px;
height:46px;
}

.left{
gap:12px;
}

.country{
font-size:16px;
}

.route{
font-size:11px;
}

.price{
font-size:20px;
}

.workPrice{
font-size:32px;
}

.final{
font-size:30px;
}

.footer{
font-size:15px;
}

}

</style>
</head>

<body>

<div class="bg">
<div class="blur1"></div>
<div class="blur2"></div>
<div class="blur3"></div>
</div>

<div class="container">

<div class="header">

<div class="logo">
💎
</div>

<div class="title">
AHS SMS Pricing
</div>

<div class="subtitle">
Premium SMS Earnings Dashboard
</div>

</div>

<div class="searchBox">

<div class="searchWrap">

<div class="searchIcon">
🔍
</div>

<input
type="text"
class="searchInput"
placeholder="Search country..."
id="search"
>

</div>

</div>

<div id="list"></div>

<div class="footer">
Powered By <span>AHS SHOVON</span>
</div>

</div>

<script>

const countries = [

{name:"Vietnam",price:0.0104,flag:"https://flagcdn.com/w320/vn.png"},
{name:"Yemen",price:0.0104,flag:"https://flagcdn.com/w320/ye.png"},
{name:"Zambia",price:0.0104,flag:"https://flagcdn.com/w320/zm.png"},
{name:"Zimbabwe",price:0.0112,flag:"https://flagcdn.com/w320/zw.png"}

];

const list = document.getElementById("list");

function render(data){

list.innerHTML = "";

if(data.length === 0){

list.innerHTML = `

<div class="noResult">

<h2>
❌ This Country is not available
</h2>

<p>
Please search another country.<br>
This SMS route is currently unavailable.
</p>

</div>

`;

return;
}

data.forEach((c,index)=>{

const card = document.createElement("div");

card.className = "card";

card.innerHTML = `

<div class="top">

<div class="left">

<img class="flag" src="${c.flag}">

<div>

<div class="country">
${c.name}
</div>

<div class="route">
Premium SMS Route
</div>

</div>

</div>

<div class="price">
$${c.price}
</div>

</div>

<div class="details">

<div class="workBox">

<h4>
💰 Per SMS Earnings
</h4>

<div class="workPrice">
$${c.price}
</div>

</div>

<div class="calc">

<h3>
🧮 SMS Calculator
</h3>

<input
type="number"
class="smsInput"
placeholder="Example: 100 SMS"
oninput="calculate(this,${c.price})"
>

<div class="result">

📨 Total SMS:
<b class="smsCount">0</b>

<br>

💵 Per SMS Earnings:
<b style="color:#22c55e;">
$${c.price}
</b>

<br>

✅ Total Earnings:

<div class="final">
$0
</div>

</div>

</div>

</div>

`;

card.onclick = function(e){

if(
e.target.classList.contains("smsInput")
)return;

document.querySelectorAll(".card").forEach(el=>{

if(el!==card){
el.classList.remove("active");
}

});

card.classList.toggle("active");

};

list.appendChild(card);

});

}

function calculate(input,price){

const qty = Number(input.value || 0);

const result = qty * price;

const box = input.parentElement.querySelector(".result");

box.querySelector(".smsCount").innerText = qty;

box.querySelector(".final").innerText =
"$" + parseFloat(result.toFixed(4));

}

render(countries);

document.getElementById("search").addEventListener("input",e=>{

const value = e.target.value.toLowerCase();

const filtered = countries.filter(c=>
c.name.toLowerCase().includes(value)
);

render(filtered);

});

</script>

</body>
</html>
