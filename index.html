<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AHS SMS Pricing</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#020617;
color:#fff;
overflow-x:hidden;
min-height:100vh;
position:relative;
}

/* BACKGROUND */

.bg{
position:fixed;
inset:0;
z-index:-1;
overflow:hidden;
}

.blur1{
position:absolute;
width:550px;
height:550px;
background:#2563eb;
border-radius:50%;
filter:blur(150px);
top:-160px;
left:-150px;
opacity:.65;
}

.blur2{
position:absolute;
width:500px;
height:500px;
background:#9333ea;
border-radius:50%;
filter:blur(150px);
bottom:-140px;
right:-140px;
opacity:.55;
}

.blur3{
position:absolute;
width:350px;
height:350px;
background:#06b6d4;
border-radius:50%;
filter:blur(120px);
top:45%;
left:50%;
transform:translate(-50%,-50%);
opacity:.25;
}

/* CONTAINER */

.container{
max-width:950px;
margin:auto;
padding:22px;
}

/* HEADER */

.header{
text-align:center;
padding-top:15px;
margin-bottom:35px;
}

.logo{
width:115px;
height:115px;
margin:auto;
border-radius:34px;
background:linear-gradient(135deg,#2563eb,#9333ea);
display:flex;
align-items:center;
justify-content:center;
font-size:58px;
box-shadow:
0 0 40px rgba(59,130,246,.4),
0 0 100px rgba(147,51,234,.35);
margin-bottom:22px;
animation:float 3s ease-in-out infinite;
}

.title{
font-size:70px;
font-weight:900;
line-height:1;
background:linear-gradient(90deg,#60a5fa,#d946ef);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:12px;
}

.subtitle{
font-size:22px;
color:#cbd5e1;
}

/* SEARCH */

.search-box{
margin-bottom:26px;
position:sticky;
top:10px;
z-index:999;
backdrop-filter:blur(10px);
}

.search-input{
width:100%;
height:78px;
border:none;
outline:none;
padding:0 28px;
border-radius:28px;
background:rgba(15,23,42,.75);
backdrop-filter:blur(14px);
font-size:27px;
color:#fff;
border:1px solid rgba(255,255,255,.05);
transition:.35s;
}

.search-input::placeholder{
color:#94a3b8;
}

.search-input:focus{
border-color:#3b82f6;
background:rgba(15,23,42,.95);
box-shadow:
0 0 30px rgba(59,130,246,.3),
0 0 80px rgba(147,51,234,.25);
}

/* COUNTRY LIST */

.country-list{
display:flex;
flex-direction:column;
gap:24px;
}

/* CARD */

.card{
background:rgba(15,23,42,.7);
backdrop-filter:blur(14px);
border-radius:34px;
padding:24px;
border:1px solid rgba(255,255,255,.05);
transition:.35s;
overflow:hidden;
}

.card:hover{
transform:translateY(-5px);
box-shadow:
0 0 35px rgba(59,130,246,.25),
0 0 90px rgba(147,51,234,.15);
border-color:#3b82f6;
}

.top{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
cursor:pointer;
}

.left{
display:flex;
align-items:center;
gap:18px;
flex:1;
min-width:0;
}

.flag{
width:72px;
height:72px;
border-radius:50%;
object-fit:cover;
border:3px solid rgba(255,255,255,.08);
box-shadow:0 0 22px rgba(255,255,255,.12);
flex-shrink:0;
}

.country-info{
flex:1;
min-width:0;
}

.country-name{
font-size:38px;
font-weight:800;
line-height:1.1;
word-break:break-word;
}

.country-sub{
font-size:18px;
color:#94a3b8;
margin-top:6px;
}

.price{
font-size:44px;
font-weight:900;
color:#22c55e;
text-shadow:0 0 18px rgba(34,197,94,.35);
white-space:nowrap;
flex-shrink:0;
}

/* EXPAND */

.expand{
max-height:0;
overflow:hidden;
transition:max-height .5s ease;
}

.expand.show{
max-height:1000px;
margin-top:24px;
}

/* NOTICE */

.notice{
background:rgba(255,255,255,.03);
padding:24px;
border-radius:24px;
border:1px solid rgba(255,255,255,.05);
font-size:20px;
line-height:1.9;
color:#dbeafe;
margin-bottom:24px;
}

.notice-title{
font-size:28px;
font-weight:800;
color:#facc15;
margin-bottom:12px;
}

.green{
color:#22c55e;
font-weight:800;
}

/* WORK BOX */

.work-box{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
padding:24px;
border-radius:26px;
margin-bottom:24px;
box-shadow:0 0 40px rgba(37,99,235,.25);
}

.work-title{
font-size:21px;
margin-bottom:12px;
}

.work-price{
font-size:55px;
font-weight:900;
}

/* CALCULATOR */

.calculator{
background:rgba(255,255,255,.03);
padding:24px;
border-radius:24px;
border:1px solid rgba(255,255,255,.05);
}

.calc-title{
font-size:32px;
font-weight:800;
margin-bottom:18px;
}

.calc-input{
width:100%;
height:72px;
border:none;
outline:none;
border-radius:20px;
padding:0 22px;
font-size:26px;
background:#0b132b;
color:#fff;
border:1px solid rgba(255,255,255,.05);
margin-bottom:18px;
}

.calc-input:focus{
border-color:#3b82f6;
box-shadow:0 0 25px rgba(59,130,246,.25);
}

.calc-result{
background:#0b132b;
padding:24px;
border-radius:22px;
font-size:20px;
line-height:2;
word-break:break-word;
}

.result-total{
font-size:52px;
font-weight:900;
color:#22c55e;
margin-top:12px;
}

/* FOOTER */

.footer{
margin-top:45px;
text-align:center;
padding-bottom:20px;
font-size:18px;
color:#cbd5e1;
}

.footer span{
font-weight:800;
color:#60a5fa;
}

/* NO RESULT */

.no-result{
text-align:center;
padding:70px 20px;
font-size:30px;
color:#94a3b8;
}

/* MOBILE FIX */

@media(max-width:768px){

.container{
padding:16px;
}

.logo{
width:95px;
height:95px;
font-size:46px;
border-radius:28px;
}

.title{
font-size:48px;
}

.subtitle{
font-size:16px;
}

.search-input{
height:66px;
font-size:21px;
border-radius:22px;
}

.card{
padding:18px;
border-radius:26px;
}

.flag{
width:58px;
height:58px;
}

.country-name{
font-size:24px;
}

.country-sub{
font-size:15px;
}

.price{
font-size:28px;
}

.notice{
font-size:16px;
padding:18px;
}

.notice-title{
font-size:22px;
}

.work-title{
font-size:18px;
}

.work-price{
font-size:40px;
}

.calc-title{
font-size:24px;
}

.calc-input{
height:62px;
font-size:20px;
}

.calc-result{
font-size:16px;
padding:18px;
}

.result-total{
font-size:34px;
}

.footer{
font-size:16px;
}

}

/* SMALL PHONE FIX */

@media(max-width:430px){

.top{
align-items:flex-start;
}

.left{
gap:12px;
}

.flag{
width:52px;
height:52px;
}

.country-name{
font-size:20px;
}

.country-sub{
font-size:13px;
}

.price{
font-size:22px;
margin-top:3px;
}

.title{
font-size:42px;
}

.subtitle{
font-size:15px;
}

.search-input{
font-size:19px;
}

}

/* ANIMATION */

@keyframes float{
0%{
transform:translateY(0);
}
50%{
transform:translateY(-8px);
}
100%{
transform:translateY(0);
}
}

</style>
</head>
<body>

<div class="bg">
<div class="blur1"></div>
<div class="blur2"></div>
<div class="blur3"></div>
</div>

<div class="container">

<div class="header">

<div class="logo">
💎
</div>

<div class="title">
AHS SMS Pricing
</div>

<div class="subtitle">
Premium SMS Working Price Dashboard
</div>

</div>

<div class="search-box">

<input
type="text"
class="search-input"
id="searchInput"
placeholder="🔍 Search country..."
>

</div>

<div class="country-list" id="countryList"></div>

<div class="footer">
Powered By <span>AHS SHOVON</span>
</div>

</div>

<script>

const countries = [

{name:"Afghanistan",price:0.013,flag:"https://flagcdn.com/w320/af.png"},
{name:"Algeria",price:0.018,flag:"https://flagcdn.com/w320/dz.png"},
{name:"Angola",price:0.015,flag:"https://flagcdn.com/w320/ao.png"},
{name:"Argentina",price:0.013,flag:"https://flagcdn.com/w320/ar.png"},
{name:"Armenia",price:0.013,flag:"https://flagcdn.com/w320/am.png"},
{name:"Azerbaijan",price:0.010,flag:"https://flagcdn.com/w320/az.png"},
{name:"Belarus",price:0.010,flag:"https://flagcdn.com/w320/by.png"},
{name:"Benin",price:0.013,flag:"https://flagcdn.com/w320/bj.png"},
{name:"Bhutan",price:0.010,flag:"https://flagcdn.com/w320/bt.png"},
{name:"Bolivia",price:0.010,flag:"https://flagcdn.com/w320/bo.png"},
{name:"Bulgaria",price:0.010,flag:"https://flagcdn.com/w320/bg.png"},
{name:"Cambodia",price:0.023,flag:"https://flagcdn.com/w320/kh.png"},
{name:"Cameroon",price:0.013,flag:"https://flagcdn.com/w320/cm.png"},
{name:"Comoros",price:0.023,flag:"https://flagcdn.com/w320/km.png"},
{name:"Ecuador",price:0.010,flag:"https://flagcdn.com/w320/ec.png"},
{name:"Egypt",price:0.010,flag:"https://flagcdn.com/w320/eg.png"},
{name:"Ethiopia",price:0.013,flag:"https://flagcdn.com/w320/et.png"},
{name:"Germany",price:0.013,flag:"https://flagcdn.com/w320/de.png"},
{name:"Indonesia",price:0.013,flag:"https://flagcdn.com/w320/id.png"},
{name:"Iraq",price:0.013,flag:"https://flagcdn.com/w320/iq.png"},
{name:"Jordan",price:0.013,flag:"https://flagcdn.com/w320/jo.png"},
{name:"Kazakhstan",price:0.013,flag:"https://flagcdn.com/w320/kz.png"},
{name:"Kenya",price:0.013,flag:"https://flagcdn.com/w320/ke.png"},
{name:"Kuwait",price:0.010,flag:"https://flagcdn.com/w320/kw.png"},
{name:"Libya",price:0.013,flag:"https://flagcdn.com/w320/ly.png"},
{name:"Madagascar",price:0.013,flag:"https://flagcdn.com/w320/mg.png"},
{name:"Malaysia",price:0.019,flag:"https://flagcdn.com/w320/my.png"},
{name:"Morocco",price:0.013,flag:"https://flagcdn.com/w320/ma.png"},
{name:"Myanmar",price:0.017,flag:"https://flagcdn.com/w320/mm.png"},
{name:"Nepal",price:0.010,flag:"https://flagcdn.com/w320/np.png"},
{name:"Nigeria",price:0.013,flag:"https://flagcdn.com/w320/ng.png"},
{name:"Oman",price:0.013,flag:"https://flagcdn.com/w320/om.png"},
{name:"Pakistan",price:0.013,flag:"https://flagcdn.com/w320/pk.png"},
{name:"Russia",price:0.013,flag:"https://flagcdn.com/w320/ru.png"},
{name:"Saudi Arabia",price:0.010,flag:"https://flagcdn.com/w320/sa.png"},
{name:"Senegal",price:0.013,flag:"https://flagcdn.com/w320/sn.png"},
{name:"Sri Lanka",price:0.023,flag:"https://flagcdn.com/w320/lk.png"},
{name:"Sudan",price:0.012,flag:"https://flagcdn.com/w320/sd.png"},
{name:"Syria",price:0.013,flag:"https://flagcdn.com/w320/sy.png"},
{name:"Tajikistan",price:0.010,flag:"https://flagcdn.com/w320/tj.png"},
{name:"Tanzania",price:0.025,flag:"https://flagcdn.com/w320/tz.png"},
{name:"Tunisia",price:0.018,flag:"https://flagcdn.com/w320/tn.png"},
{name:"Turkey",price:0.012,flag:"https://flagcdn.com/w320/tr.png"},
{name:"Turkmenistan",price:0.013,flag:"https://flagcdn.com/w320/tm.png"},
{name:"Uganda",price:0.012,flag:"https://flagcdn.com/w320/ug.png"},
{name:"Ukraine",price:0.012,flag:"https://flagcdn.com/w320/ua.png"},
{name:"United Arab Emirates",price:0.010,flag:"https://flagcdn.com/w320/ae.png"},
{name:"Uzbekistan",price:0.013,flag:"https://flagcdn.com/w320/uz.png"},
{name:"Vietnam",price:0.013,flag:"https://flagcdn.com/w320/vn.png"},
{name:"Yemen",price:0.013,flag:"https://flagcdn.com/w320/ye.png"},
{name:"Zambia",price:0.013,flag:"https://flagcdn.com/w320/zm.png"},
{name:"Zimbabwe",price:0.013,flag:"https://flagcdn.com/w320/zw.png"}

];

const countryList = document.getElementById("countryList");
const searchInput = document.getElementById("searchInput");

function formatPrice(num){
return parseFloat(num.toFixed(4)).toString();
}

function render(data){

countryList.innerHTML = "";

if(data.length===0){

countryList.innerHTML = `
<div class="no-result">
❌ No Country Found
</div>
`;

return;

}

data.forEach((item,index)=>{

const workingPrice = item.price - (item.price*0.10);

countryList.innerHTML += `

<div class="card">

<div class="top" onclick="toggleBox(${index})">

<div class="left">

<img src="${item.flag}" class="flag">

<div class="country-info">

<div class="country-name">
${item.name}
</div>

<div class="country-sub">
Premium SMS Route
</div>

</div>

</div>

<div class="price">
$${formatPrice(item.price)}
</div>

</div>

<div class="expand" id="expand${index}">

<div class="notice">

<div class="notice-title">
⚠️ 10% Service Charge Applied
</div>

Main Price:
<span class="green">
$${formatPrice(item.price)}
</span>

<br><br>

10% Service Charge কেটে নেওয়ার পর আপনাদের কাজের মূল দাম (Working Price) হবে:

<br><br>

<span class="green">
$${formatPrice(workingPrice)}
</span>

</div>

<div class="work-box">

<div class="work-title">
💰 Final Working Price
</div>

<div class="work-price">
$${formatPrice(workingPrice)}
</div>

</div>

<div class="calculator">

<div class="calc-title">
📱 SMS Calculator
</div>

<input
type="number"
class="calc-input"
placeholder="Example: 100 SMS"
oninput="calculateSMS(this,${workingPrice},'result${index}')"
>

<div class="calc-result" id="result${index}">

📊 SMS Quantity অনুযায়ী total earning এখানে show হবে।

</div>

</div>

</div>

</div>

`;

});

}

function toggleBox(id){

const all = document.querySelectorAll(".expand");

all.forEach((box,index)=>{

if(index===id){
box.classList.toggle("show");
}else{
box.classList.remove("show");
}

});

}

function calculateSMS(input,price,resultId){

const qty = parseInt(input.value);

if(!qty || qty<=0){

document.getElementById(resultId).innerHTML = `
📊 SMS Quantity অনুযায়ী total earning এখানে show হবে।
`;

return;

}

const total = qty * price;

document.getElementById(resultId).innerHTML = `

📨 Total SMS:
<b>${qty}</b>

<br>

💵 Per SMS Working Price:
<span class="green">
$${formatPrice(price)}
</span>

<br>

✅ Final Working Amount:

<div class="result-total">
$${formatPrice(total)}
</div>

`;

}

searchInput.addEventListener("input",()=>{

const value = searchInput.value.toLowerCase();

const filtered = countries.filter(item =>
item.name.toLowerCase().includes(value)
);

render(filtered);

});

render(countries);

</script>

</body>
</html>
