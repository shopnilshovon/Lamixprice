<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AHS SMS Pricing</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:
radial-gradient(circle at top left,#1d4ed8 0%,transparent 30%),
radial-gradient(circle at bottom right,#7e22ce 0%,transparent 30%),
#020617;
color:white;
overflow-x:hidden;
min-height:100vh;
padding:22px;
}

.container{
max-width:950px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:40px;
animation:fadeDown 1s ease;
}

.logo{
width:95px;
height:95px;
border-radius:28px;
background:linear-gradient(135deg,#2563eb,#9333ea);
display:flex;
align-items:center;
justify-content:center;
margin:auto;
font-size:45px;
box-shadow:
0 0 40px rgba(59,130,246,.35),
0 0 90px rgba(147,51,234,.25);
margin-bottom:20px;
animation:float 3s ease-in-out infinite;
}

.title{
font-size:60px;
font-weight:900;
line-height:1.1;
background:linear-gradient(90deg,#60a5fa,#a855f7);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.subtitle{
margin-top:14px;
font-size:18px;
color:#94a3b8;
}

.search-box{
position:sticky;
top:10px;
z-index:999;
margin-bottom:28px;
backdrop-filter:blur(14px);
}

.search-input{
width:100%;
height:72px;
border:none;
outline:none;
padding:0 24px;
border-radius:26px;
background:rgba(15,23,42,.75);
backdrop-filter:blur(15px);
font-size:24px;
color:white;
border:1px solid rgba(255,255,255,.06);
transition:.35s;
}

.search-input:focus{
transform:scale(1.01);
border-color:#3b82f6;
box-shadow:0 0 30px rgba(59,130,246,.25);
}

.search-input::placeholder{
color:#94a3b8;
}

.country-list{
display:flex;
flex-direction:column;
gap:24px;
}

.card{
background:rgba(15,23,42,.75);
backdrop-filter:blur(15px);
border-radius:34px;
padding:24px;
border:1px solid rgba(255,255,255,.05);
position:relative;
overflow:hidden;
transition:.35s;
animation:fadeUp .6s ease;
}

.card::before{
content:'';
position:absolute;
inset:0;
background:linear-gradient(135deg,rgba(255,255,255,.06),transparent);
opacity:0;
transition:.35s;
}

.card:hover::before{
opacity:1;
}

.card:hover{
transform:translateY(-6px);
border-color:#3b82f6;
box-shadow:
0 0 35px rgba(59,130,246,.25),
0 0 80px rgba(147,51,234,.15);
}

.top{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
cursor:pointer;
}

.left{
display:flex;
align-items:center;
gap:18px;
}

.flag{
width:68px;
height:68px;
border-radius:50%;
object-fit:cover;
border:3px solid rgba(255,255,255,.08);
box-shadow:0 0 20px rgba(255,255,255,.12);
}

.country-name{
font-size:33px;
font-weight:800;
}

.country-sub{
font-size:16px;
color:#94a3b8;
margin-top:4px;
}

.price{
font-size:38px;
font-weight:900;
color:#22c55e;
text-shadow:0 0 22px rgba(34,197,94,.35);
}

.expand{
display:none;
margin-top:28px;
padding-top:24px;
border-top:1px solid rgba(255,255,255,.06);
animation:fadeUp .4s ease;
}

.expand.show{
display:block;
}

.notice{
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.06);
padding:24px;
border-radius:24px;
line-height:1.9;
font-size:19px;
color:#dbeafe;
margin-bottom:22px;
}

.notice-title{
font-size:24px;
font-weight:800;
color:#facc15;
margin-bottom:12px;
}

.green{
color:#22c55e;
font-weight:800;
}

.work-box{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
padding:24px;
border-radius:26px;
margin-bottom:22px;
box-shadow:0 0 40px rgba(37,99,235,.25);
}

.work-title{
font-size:20px;
margin-bottom:10px;
opacity:.95;
}

.work-price{
font-size:52px;
font-weight:900;
}

.calculator{
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.06);
border-radius:24px;
padding:24px;
}

.calc-title{
font-size:28px;
font-weight:800;
margin-bottom:20px;
}

.calc-input{
width:100%;
height:68px;
border:none;
outline:none;
border-radius:20px;
padding:0 20px;
font-size:24px;
background:#0b132b;
color:white;
margin-bottom:20px;
transition:.35s;
}

.calc-input:focus{
border:1px solid #3b82f6;
box-shadow:0 0 25px rgba(59,130,246,.25);
}

.calc-result{
background:#0b132b;
padding:24px;
border-radius:22px;
line-height:2;
font-size:20px;
}

.result-total{
font-size:44px;
font-weight:900;
color:#22c55e;
margin-top:10px;
}

.no-result{
text-align:center;
padding:60px 20px;
font-size:28px;
color:#94a3b8;
}

.footer{
margin-top:40px;
text-align:center;
font-size:15px;
color:#94a3b8;
padding-bottom:20px;
}

.footer span{
color:#60a5fa;
font-weight:700;
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(25px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes fadeDown{
from{
opacity:0;
transform:translateY(-25px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes float{
0%{
transform:translateY(0px);
}
50%{
transform:translateY(-8px);
}
100%{
transform:translateY(0px);
}
}

::-webkit-scrollbar{
width:6px;
}

::-webkit-scrollbar-thumb{
background:#2563eb;
border-radius:20px;
}

@media(max-width:768px){

.title{
font-size:42px;
}

.subtitle{
font-size:15px;
}

.logo{
width:82px;
height:82px;
font-size:38px;
}

.search-input{
height:62px;
font-size:20px;
}

.country-name{
font-size:24px;
}

.country-sub{
font-size:14px;
}

.flag{
width:56px;
height:56px;
}

.price{
font-size:28px;
}

.notice{
font-size:17px;
}

.work-price{
font-size:40px;
}

.calc-title{
font-size:24px;
}

.calc-input{
font-size:20px;
}

.result-total{
font-size:34px;
}

}

</style>
</head>
<body>

<div class="container">

<div class="header">

<div class="logo">
💎
</div>

<h1 class="title">
AHS SMS Pricing
</h1>

<p class="subtitle">
Premium SMS Working Price Dashboard
</p>

</div>

<div class="search-box">

<input
type="text"
class="search-input"
id="searchInput"
placeholder="🔍 Search country..."
>

</div>

<div class="country-list" id="countryList"></div>

<div class="footer">
Powered By <span>AHS SHOVON</span>
</div>

</div>

<script>

const countries = [

{name:"Afghanistan",price:0.013,flag:"https://flagcdn.com/w320/af.png"},

{name:"Armenia",price:0.013,flag:"https://flagcdn.com/w320/am.png"},
{name:"Azerbaijan",price:0.010,flag:"https://flagcdn.com/w320/az.png"},
{name:"Belarus",price:0.010,flag:"https://flagcdn.com/w320/by.png"},
{name:"Benin",price:0.013,flag:"https://flagcdn.com/w320/bj.png"},
{name:"Bhutan",price:0.010,flag:"https://flagcdn.com/w320/bt.png"},
{name:"Bolivia",price:0.010,flag:"https://flagcdn.com/w320/bo.png"},
{name:"Bulgaria",price:0.010,flag:"https://flagcdn.com/w320/bg.png"},
{name:"Cambodia",price:0.023,flag:"https://flagcdn.com/w320/kh.png"},
{name:"Cameroon",price:0.013,flag:"https://flagcdn.com/w320/cm.png"},
{name:"Comoros",price:0.023,flag:"https://flagcdn.com/w320/km.png"},
{name:"Ecuador",price:0.010,flag:"https://flagcdn.com/w320/ec.png"},
{name:"Egypt",price:0.010,flag:"https://flagcdn.com/w320/eg.png"},
{name:"Ethiopia",price:0.013,flag:"https://flagcdn.com/w320/et.png"},
{name:"Germany",price:0.013,flag:"https://flagcdn.com/w320/de.png"},
{name:"Indonesia",price:0.013,flag:"https://flagcdn.com/w320/id.png"},
{name:"Iraq",price:0.013,flag:"https://flagcdn.com/w320/iq.png"},
{name:"Jordan",price:0.013,flag:"https://flagcdn.com/w320/jo.png"},
{name:"Kazakhstan",price:0.013,flag:"https://flagcdn.com/w320/kz.png"},
{name:"Kenya",price:0.013,flag:"https://flagcdn.com/w320/ke.png"},
{name:"Kuwait",price:0.010,flag:"https://flagcdn.com/w320/kw.png"},
{name:"Libya",price:0.013,flag:"https://flagcdn.com/w320/ly.png"},
{name:"Madagascar",price:0.013,flag:"https://flagcdn.com/w320/mg.png"},
{name:"Malaysia",price:0.019,flag:"https://flagcdn.com/w320/my.png"},
{name:"Morocco",price:0.013,flag:"https://flagcdn.com/w320/ma.png"},
{name:"Myanmar",price:0.017,flag:"https://flagcdn.com/w320/mm.png"},
{name:"Nepal",price:0.010,flag:"https://flagcdn.com/w320/np.png"},
{name:"Nigeria",price:0.013,flag:"https://flagcdn.com/w320/ng.png"},
{name:"Oman",price:0.013,flag:"https://flagcdn.com/w320/om.png"},
{name:"Pakistan",price:0.013,flag:"https://flagcdn.com/w320/pk.png"},
{name:"Russia",price:0.013,flag:"https://flagcdn.com/w320/ru.png"},
{name:"Saudi Arabia",price:0.010,flag:"https://flagcdn.com/w320/sa.png"},
{name:"Senegal",price:0.013,flag:"https://flagcdn.com/w320/sn.png"},
{name:"Sri Lanka",price:0.023,flag:"https://flagcdn.com/w320/lk.png"},
{name:"Sudan",price:0.012,flag:"https://flagcdn.com/w320/sd.png"},
{name:"Syria",price:0.013,flag:"https://flagcdn.com/w320/sy.png"},
{name:"Tajikistan",price:0.010,flag:"https://flagcdn.com/w320/tj.png"},
{name:"Tanzania",price:0.025,flag:"https://flagcdn.com/w320/tz.png"},
{name:"Tunisia",price:0.018,flag:"https://flagcdn.com/w320/tn.png"},
{name:"Turkey",price:0.012,flag:"https://flagcdn.com/w320/tr.png"},
{name:"Turkmenistan",price:0.013,flag:"https://flagcdn.com/w320/tm.png"},
{name:"Uganda",price:0.012,flag:"https://flagcdn.com/w320/ug.png"},
{name:"Ukraine",price:0.012,flag:"https://flagcdn.com/w320/ua.png"},
{name:"United Arab Emirates",price:0.010,flag:"https://flagcdn.com/w320/ae.png"},
{name:"Uzbekistan",price:0.013,flag:"https://flagcdn.com/w320/uz.png"},
{name:"Vietnam",price:0.013,flag:"https://flagcdn.com/w320/vn.png"},
{name:"Yemen",price:0.013,flag:"https://flagcdn.com/w320/ye.png"},
{name:"Zambia",price:0.013,flag:"https://flagcdn.com/w320/zm.png"},
{name:"Zimbabwe",price:0.013,flag:"https://flagcdn.com/w320/zw.png"}

];

const countryList = document.getElementById("countryList");
const searchInput = document.getElementById("searchInput");

function render(data){

countryList.innerHTML = "";

if(data.length===0){

countryList.innerHTML = `
<div class="no-result">
❌ No Country Found
</div>
`;

return;

}

data.forEach((item,index)=>{

const workingPrice = (item.price - (item.price*0.10)).toFixed(4);

countryList.innerHTML += `

<div class="card">

<div class="top" onclick="toggleBox(${index})">

<div class="left">

<img src="${item.flag}" class="flag">

<div>

<div class="country-name">
${item.name}
</div>

<div class="country-sub">
Premium SMS Route
</div>

</div>

</div>

<div class="price">
$${item.price}
</div>

</div>

<div class="expand" id="expand${index}">

<div class="notice">

<div class="notice-title">
⚠️ 10% Service Charge Applied
</div>

Main Price:
<span class="green">
$${item.price}
</span>

<br><br>

10% Service Charge কেটে নেওয়ার পর আপনাদের কাজের মূল দাম (Working Price) হবে:

<br><br>

<span class="green">
$${workingPrice}
</span>

</div>

<div class="work-box">

<div class="work-title">
💰 Final Working Price
</div>

<div class="work-price">
$${workingPrice}
</div>

</div>

<div class="calculator">

<div class="calc-title">
📱 SMS Calculator
</div>

<input
type="number"
class="calc-input"
placeholder="Example: 100 SMS"
oninput="calculateSMS(this,${workingPrice},'result${index}')"
>

<div class="calc-result" id="result${index}">

📊 SMS Quantity অনুযায়ী total earning এখানে show হবে।

</div>

</div>

</div>

</div>

`;

});

}

function toggleBox(id){

const box = document.getElementById("expand"+id);

if(box.classList.contains("show")){
box.classList.remove("show");
}else{
box.classList.add("show");
}

}

function calculateSMS(input,price,resultId){

const qty = parseInt(input.value);

if(!qty || qty<=0){

document.getElementById(resultId).innerHTML = `
📊 SMS Quantity অনুযায়ী total earning এখানে show হবে।
`;

return;

}

const total = (qty * price).toFixed(4);

document.getElementById(resultId).innerHTML = `

📨 Total SMS:
<b>${qty}</b>

<br>

💵 Per SMS Working Price:
<span class="green">
$${price}
</span>

<br>

✅ Final Working Amount:

<div class="result-total">
$${total}
</div>

`;

}

searchInput.addEventListener("input",()=>{

const value = searchInput.value.toLowerCase();

const filtered = countries.filter(item =>
item.name.toLowerCase().includes(value)
);

render(filtered);

});

render(countries);

</script>

</body>
</html>
